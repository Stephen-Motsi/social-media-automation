services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Dev setting: skip waiting for disk sync on each commit (a crash can lose the last moments of writes).
    command: ["postgres", "-c", "synchronous_commit=off"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social_automation
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY:?Set WAHA_API_KEY in .env}
      WAHA_DASHBOARD_ENABLED: ${WAHA_DASHBOARD_ENABLED:-false}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-}
      WHATSAPP_SWAGGER_ENABLED: "false"
      WHATSAPP_DEFAULT_ENGINE: NOWEB
    ports:
      - "3001:3000"
    volumes:
      - wahasessions:/app/.sessions

volumes:
  pgdata:
  wahasessions:
